<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Gunung</title>
  <style>
    * {
      margin: 0;
      padding:  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  color: #fff;
  padding: 2rem 1rem;
}

header {
  text-align: center;
  margin-bottom: 2rem;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

header h1 {
  font-weight: 500;
  letter-spacing: 2px;
  font-size: 2rem;
  background: linear-gradient(90deg, #f7797d, #FBD786, #C6FFDD);
  -webkit-background-clip: text;
  -webkit-text-f webkit-text-fill-color: transparent;
  background-clip: text;
}

header p {
  opacity: 0.8;
  margin-top: 0.5rem;
  font-size: 0.95rem;
}

/* Bagian Filter */
#filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 2rem;
}

#filters button {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 0.6rem 1.5rem;
  border-radius: 30px;
  color: #fff;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

#filters button:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

#filters button.active {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.6);
}

/* Grid Galeri */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}

.gallery-item {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  aspect-ratio: 1 / 1; /* kotak, bisa disesuaikan */
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}

.gallery-item:hover {
  transform: scale(1.02);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

.gallery-item img,
.gallery-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.gallery-item .overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0,0.4);
  backdrop-filter: blur(4px);
  padding: 0.75rem;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  font-size: 0.85rem;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.gallery-item:hover .overlay {
  transform: translateY(0);
}

.gallery-item .badge {
  position: absolute;
  top: 10px;
  right:  right: 10px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  padding: 0.2rem 0.6rem;
  border-radius: 20px;
  font-size: 0.75rem;
  border: 1px solid rgba(255,255,255,255,0.2);
}

/* Lightbox
}

#lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
likes
  padding: 2rem;
}

#lightbox.active {
  display: flex;
}

#lightbox-content {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.1);
}

#lightbox video {
  max-height: 80vh;
}

#lightbox-close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 2.5rem;
  color: #fff;
  cursor: pointer;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  boundary: 1px solid rgba(255,255,255,0.2);
  transition: 0.2s;
}

#lightbox-close:hover {
  background: rgba(255,0,0,0.6);
  transform: scale(1.1);
}

/* responsive */
@media (max-width: 600px) {
  .gallery {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
  }
  header h1 {
    font-size: 1.5rem;
  }
}

    .gallery-item .overlay {
      transform: translateY(0); /* always show on mobile */
      background: rgba(0,0,0,0.5);
    }
  }
</style>
</head>
<body>

<header>
  <h1>⛰️ Puncak Cerita</h1>
  <p>Dokumentasi perjalanan mendaki gunung</p>
</header>

<!-- Filter -->
<section id="filters">
  <button class="active" data-filter="all">Semua</button>
  <button data-filter="photo">Foto</button>
  <button data-filter="video">Video</button>
</section>

<!-- Galeri -->
<section class="gallery" id="gallery">
  <!-- item akan diisi oleh JavaScript -->
</section>

<!-- Lightbox -->
<div id="lightbox">
  <span id="lightbox-close">&times;</span>
  <div id="lightbox-content-wrapper" style="display: flex; align-items: center; justify-content: center;">
    <img id="lightbox-content" src="" alt="" style="display:none;">
    <video id="lightbox-video" src="" controls style="display:none;"></video>
  </div>
</div>

<script>
  // Data contoh – ganti dengan file kamu
  const items = [
    { type: 'photo', src: 'images/gunung1.jpg', label: 'Sunrise di puncak', location: 'Gunung Rinjani' },
    { type: 'photo', src: 'images/gunung2.jpg', label: 'Camp di sabana', location: 'Gunung Bromo' },
    { type: 'video', src: 'videos/pendakian.mp4', label: 'Perjalanan menuju puncak', location: 'Gunung Semeru' },
    { type: 'photo', src: 'images/gunung3.jpg', label: 'Pemandangan awan', location: 'Gunung Prau' },
    // Tambahkan lebih banyak sesuai kebutuhan
  ];

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-content');
  const lightboxVideo = document.getElementById('lightbox-video');
  const closeBtn = document.getElementById('lightbox-close');

  let currentFilter = 'all';

  // Render galeri
  function renderGallery() {
    gallery.innerHTML = '';
    const filtered = currentFilter === 'all' ? items : items.filter(item => item.type === currentFilter);

    filtered.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.dataset.index = index;
      div.dataset.type = item.type;

      const media = item.type === 'photo' ? document.createElement('img') : document.createElement('video');
      media.src = item.src;
      media.loading = 'lazy';
      if (item.type === 'video') {
        media.muted = true;
        media.preload = 'metadata';
      }
      div.appendChild(media);

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = item.type === 'photo' ? '📷' : '🎬';
      div.appendChild(badge);

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<strong>${item.label}</strong><br><small>${item.location}</small> || ''}</small>`;
      div.appendChild(overlay);

      div.addEventListener('click', () => openLightbox(item));
      gallery.appendChild(div);
    });
  }

  // Buka lightbox
  function openLightbox(item) {
    lightbox.classList.add('active');
    if (item.type === 'photo') {
      lightboxImg.src = item.src;
      lightboxImg.style.display = 'block';
      lightboxVideo.style.display = 'none';
      lightboxVideo.pause();
    } else {
      lightboxVideo.src = item.src;
      lightboxVideo.style.display = 'block';
      lightboxImg.style.display = 'none';
      lightboxVideo.play();
    }
    document.body.style.overflow = 'hidden';
  }

  // Tutup lightbox
  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxVideo.pause();
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  // Filter
  document.querySelectorAll('#filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('#filters button.active').classList.remove('active');
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGallery();
    });
  });

  // Initial render
  renderGallery();
</script>

</body>
</html>
